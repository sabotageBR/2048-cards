<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<title>Monstros do duelo</title>
<style>
  html, body { margin: 0; background: #1b1424; color: #f4ecff; font: 600 13px Fredoka, system-ui, sans-serif; }
  canvas { display: block; }
</style>
</head>
<body>
<!-- Folha de conferencia dos monstros: as 5 especies, as 8 variantes de cada
     (a 8a e o chefao) e as poses (golpe, ataque, furia, derrotado).
     ?poses=1 mostra so as poses; ?t=segundos fixa o relogio. -->
<canvas id="c"></canvas>
<script type="module">
import { desenharMonstro, variante, ESPECIE_DO_REINO } from '../src/render/monstros.js';
const q = new URLSearchParams(location.search);
const t = Number(q.get('t') || 1.3);
const poses = q.get('poses') === '1';
const c = document.getElementById('c');
const ctx = c.getContext('2d');
const cel = 150, R = 50, topo = 30;
const colunas = poses ? 6 : 8;
const W = cel * colunas + 110, H = topo + cel * ESPECIE_DO_REINO.length;
c.width = W * 2; c.height = H * 2; c.style.width = W + 'px'; c.style.height = H + 'px';
ctx.scale(2, 2);
ctx.fillStyle = '#e8f1ff'; ctx.fillRect(0, 0, W, H);
ctx.fillStyle = '#2a1630'; ctx.font = '700 13px Fredoka, system-ui, sans-serif';
const cab = poses ? ['parado', 'golpe', 'preparando', 'soltando', 'furia', 'derrotado'] : ['1', '2', '3', '4', '5', '6', '7', 'chefao (8)'];
cab.forEach((s, i) => ctx.fillText(s, 110 + i * cel + 8, 20));
ESPECIE_DO_REINO.forEach((esp, l) => {
  const y0 = topo + l * cel;
  ctx.fillStyle = '#2a1630'; ctx.fillText(esp, 10, y0 + cel / 2);
  for (let i = 0; i < colunas; i++) {
    const x = 110 + i * cel;
    ctx.fillStyle = (i + l) % 2 ? '#d7e6fa' : '#cfe0f7'; ctx.fillRect(x, y0, cel, cel);
    const def = variante(esp, poses ? 8 : i + 1);
    const pose = !poses ? {} : [{}, { golpe: 0.2 }, { ataque: 0.35 }, { ataque: 0.65 }, { furia: true }, { derrotado: true }][i];
    desenharMonstro(ctx, def, { x: x + cel / 2, y: y0 + cel - 22, R }, t, pose);
  }
});
document.title = 'PRONTO';
</script>
</body>
</html>
