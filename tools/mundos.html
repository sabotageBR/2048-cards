<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>mundos</title>
<style>
  @font-face { font-family: 'Fredoka'; src: url('../src/ui/fontes/fredoka-latin-700-normal.woff2') format('woff2'); font-weight: 700; }
  @font-face { font-family: 'Fredoka'; src: url('../src/ui/fontes/fredoka-latin-600-normal.woff2') format('woff2'); font-weight: 600; }
  html, body { margin: 0; background: #17131f; color: #f4efe6; font-family: Fredoka, system-ui, sans-serif; overflow: hidden; }
  body { padding: 28px 32px 36px; width: max-content; }
  h1 { margin: 0 0 4px; font-size: 32px; }
  .sub { margin: 0 0 22px; color: #bdb3c9; font-size: 17px; max-width: 1900px; }
  .grade { display: grid; gap: 18px 22px; }
  figure { margin: 0; }
  figure img, figure canvas { display: block; border-radius: 22px; box-shadow: 0 6px 24px rgba(0,0,0,.45); }
  figcaption { margin-top: 10px; max-width: 390px; }
  figcaption b { display: block; font-size: 20px; }
  figcaption span { display: block; color: #cfc6da; font-size: 14.5px; line-height: 1.35; margin-top: 3px; }
  .cartas canvas { border-radius: 16px; }
</style></head>
<body>
<h1 id="titulo"></h1><p class="sub" id="sub"></p>
<div class="grade" id="grade"></div>
<script type="module">
// Folhas dos 5 mundos (Elementos, aprovados em 2026-10-13) para revisar o
// visual (tools/mundos.mjs tira os prints em docs/mundos/prints/ e fotografa
// esta pagina):
//   ?folha=retrato   os 5 mundos em 390x844
//   ?folha=paisagem  os 5 mundos em 1280x720 (desktop)
//   ?folha=cartas    a escada de cartas de cada tema (2..2048, especiais, marcada, pilha)
//   ?folha=regras    o proibido, o contador do descarte e o video de esvaziar
//   ?folha=explosoes a explosao de cada mundo (fusao, 2048 e a festa da subida), quadros deterministicos
//   ?folha=festa     a subida de nivel sem pausa: o "16!" piscando enquanto o jogador joga (prints do jogo)
//   ?folha=juntar    o braço juntar do teste A/B da 0.6.0: a mao guiada, o arrasto da carta da mesa, o proibido e a cascata (prints do jogo)
//   ?folha=missao    a missao ativa na mesa (A no painel, B no vao dos botoes), o voo do premio e os 7 icones nos 5 mundos
import { TEMAS } from '../src/render/temas/index.js';
import { definirRotulos } from '../src/render/temas/kit.js';
import { desenharCarta, definirTema, limparCache } from '../src/render/cartas.js';
import { proibido, rr } from '../src/render/desenho.js';
import { criarParticulas } from '../src/render/particulas.js';
import { tocarEfeito, registrarFormas } from '../src/render/efeitos.js';
import { Transicoes as Tr } from '../src/render/transicoes.js';
import { ICONES, ICONES_MISSAO, curto } from '../src/ui/icones.js';

const q = new URLSearchParams(location.search);
const folha = q.get('folha') || 'retrato';
const $ = (id) => document.getElementById(id);
const P = '../docs/mundos/prints/';
const MUNDOS = [
  { n: 1, nome: 'Floresta', nov: 'coringa no nível 2, bomba no 4', txt: 'Clareira de manhã, sol com raios, morros e árvores redondas, pólen e folhas no ar. Carta de marfim bem redonda, a faixa do número em onda. Mesa de madeira clara com feltro musgo.' },
  { n: 2, nome: 'Oceano', nov: '+ dobro', txt: 'O mar visto de dentro d’água: feixes de luz, algas, corais e bolhas subindo. Carta de vidro tingido na cor do valor, número branco e borda de pérola. Mesa de vidro com aro aqua.' },
  { n: 3, nome: 'Neve', nov: '+ ×4', txt: 'Noite de inverno: lua, aurora que ondula, montanhas e pinheiros, neve caindo. Carta de porcelana de cantos firmes: só o número e um fio na cor do valor. Mesa de gelo.' },
  { n: 4, nome: 'Deserto', nov: 'descarte com 2 lugares', txt: 'Fim de tarde nas dunas: sol baixo, mesas de pedra, cactos e areia correndo com o vento. Carta de pergaminho como a de baralho (fio interno). Mesa de arenito.' },
  { n: 5, nome: 'Cosmos', nov: '3 colunas', txt: 'Espaço fundo: nebulosas, planeta com anel, estrelas que piscam e estrela cadente. Carta de vidro escuro com número e borda em neon, perto da referência. Mesa de vidro escuro com aro neon.' },
];

function fig(src, titulo, texto, larg) {
  const f = document.createElement('figure');
  const img = new Image(); img.src = src; if (larg) img.width = larg;
  f.appendChild(img);
  const c = document.createElement('figcaption');
  c.innerHTML = `<b>${titulo}</b>${texto ? `<span>${texto}</span>` : ''}`;
  if (larg) c.style.maxWidth = larg + 'px';
  f.appendChild(c);
  return f;
}
const pronto = () => Promise.all([...document.images].map((i) => (i.complete ? 1 : new Promise((ok) => { i.onload = ok; i.onerror = ok; })))).then(() => { document.title = 'PRONTO'; });

if (folha === 'retrato') {
  $('titulo').textContent = 'Um visual por mundo: Elementos (retrato 390×844)';
  $('sub').textContent = 'Mesma mesa de demonstração em todos: todos os valores, um topo que já recebeu especial com o sinal de proibido, a pilha do descarte em 2 lugares e os especiais na mão.';
  const g = $('grade'); g.style.gridTemplateColumns = 'repeat(5, 390px)';
  for (const m of MUNDOS) g.appendChild(fig(`${P}${m.n}-retrato.png`, `Mundo ${m.n} · ${m.nome} (${m.nov})`, m.txt));
  pronto();
} else if (folha === 'paisagem') {
  $('titulo').textContent = 'Elementos no computador (paisagem 1280×720)';
  $('sub').textContent = 'Os mesmos mundos na tela grande da Poki.';
  const g = $('grade'); g.style.gridTemplateColumns = 'repeat(3, 640px)';
  for (const m of MUNDOS) g.appendChild(fig(`${P}${m.n}-paisagem.png`, `Mundo ${m.n} · ${m.nome}`, '', 640));
  pronto();
} else if (folha === 'regras') {
  $('titulo').textContent = 'Regras novas na tela';
  $('sub').textContent = 'Um especial por carta (o sinal de proibido), o descarte com lugares por nível (o contador) e o vídeo com prêmio.';
  const g = $('grade'); g.style.gridTemplateColumns = 'repeat(4, 390px)';
  g.appendChild(fig(`${P}regra-selo.png`, 'Especial na mão', 'O 8 já recebeu um especial: com o coringa, o dobro ou o ×4 na mão, ele mostra o proibido pequeno.'));
  g.appendChild(fig(`${P}regra-recusa.png`, 'Tentou mesmo assim', 'A jogada é recusada: a coluna treme e o proibido salta. Nenhum texto explica; o sinal basta.'));
  g.appendChild(fig(`${P}regra-cheio.png`, 'Descarte cheio', 'O contador fica vermelho (3/3) e aparece “cheio”; ele esvazia no nível seguinte. Embaixo, o vídeo para esvaziar.'));
  g.appendChild(fig(`${P}regra-video.png`, 'Depois do vídeo', 'A pilha volta a 0/3 e o botão some até o próximo nível. Há também “🎬 ★+1”: um coringa quando a mesa aperta.'));
  pronto();
} else if (folha === 'cartas') {
  await document.fonts.load('700 20px Fredoka');
  definirRotulos({ bomba: 'BOMBA' });
  $('titulo').textContent = 'As cartas de cada mundo';
  $('sub').textContent = 'Todos os valores, os especiais (coringa, bomba, ×2, ×4) e uma pilha como fica na mesa. As cores dos valores são as mesmas em todos os mundos (o 8 é sempre laranja), muda o material.';
  const g = $('grade'); g.style.gridTemplateColumns = '1fr'; g.classList.add('cartas');
  const W = 1500, cw = 78, ch = 110, gap = 10;
  for (const m of MUNDOS) {
    const tema = TEMAS[m.n];
    definirTema(tema); limparCache();
    const cv = document.createElement('canvas');
    const H = 290, dpr = 2;
    cv.width = W * dpr; cv.height = H * dpr; cv.style.width = W + 'px'; cv.style.height = H + 'px';
    const ctx = cv.getContext('2d'); ctx.scale(dpr, dpr);
    // fundo: o miolo da mesa do tema
    tema.mesa.tabuleiro(ctx, { x: 4, y: 4, w: W - 8, h: H - 8 }, tema.paleta, 0, 0);
    const vals = [2, 4, 8, 16, 32, 64, 128, 256, 512, 1024, 2048];
    vals.forEach((v, i) => desenharCarta(ctx, { id: i, tipo: 'normal', v }, { x: 26 + i * (cw + gap), y: 24, w: cw, h: ch, dpr, t: 0.6 }));
    ['coringa', 'bomba', 'dobro', 'quadruplo'].forEach((tipo, i) => desenharCarta(ctx, { id: 50 + i, tipo, v: 0 }, { x: 26 + i * (cw + gap), y: 154, w: cw, h: ch, dpr, t: 0.6 }));
    // pilha como na mesa, depois do 2048: 256, 128, 64 e o 32 que recebeu especial (com o selo)
    const px = 26 + 11 * (cw + gap) + 34, py = 24, passo = ch * 0.3;
    [256, 128, 64, 32].forEach((v, i) => desenharCarta(ctx, { id: 80 + i, tipo: 'normal', v, esp: v === 32 }, { x: px, y: py + i * passo, w: cw, h: ch, dpr, t: 0.6 }));
    proibido(ctx, px + cw - cw * 0.16 * 0.85, py + 3 * passo + cw * 0.16 * 0.85, cw * 0.16);
    const tx = 26 + 4 * (cw + gap) + 30;
    ctx.fillStyle = tema.mesa.rotulo; ctx.font = '700 30px Fredoka, sans-serif'; ctx.fillText(`Mundo ${m.n} · ${m.nome}`, tx, 206);
    ctx.font = '600 17px Fredoka, sans-serif'; ctx.globalAlpha = 0.85; ctx.fillText(m.nov, tx, 234); ctx.globalAlpha = 1;
    g.appendChild(cv);
  }
  document.fonts.ready.then(() => { document.title = 'PRONTO'; });
} else if (folha === 'festa') {
  $('titulo').textContent = 'Subida de nível sem pausa: o valor feito pisca e o jogo segue';
  $('sub').textContent = 'A abertura do nível 1 (as 3 jogadas que fazem o 16) e uma 4ª jogada durante a festa. Sem placa, sem trilha, sem bloqueio: o "16!" pisca sobre a mesa com o confete e a explosão do mundo, e a carta seguinte já entra.';
  const g = $('grade'); g.style.gridTemplateColumns = 'repeat(4, 390px)';
  g.appendChild(fig(`${P}festa-1.png`, '1. O 16 nasce', 'A 3ª jogada da abertura: o 4 sobre o 4 vira 8 e encadeia no 16 (cascata ×2). A barra enche.'));
  g.appendChild(fig(`${P}festa-2.png`, '2. "16!" entra', 'Clarão suave, o valor feito entra piscando e a explosão da Floresta (folhas, pétalas e pólen) sai do meio da mesa.'));
  g.appendChild(fig(`${P}festa-3.png`, '3. Festa cheia', 'Confete nas cores do mundo. O painel já diz "Faça um 32"; a fila continua livre.'));
  g.appendChild(fig(`${P}festa-4.png`, '4. Jogando por baixo', 'O jogador já soltou a carta seguinte na coluna vazia enquanto o "16!" sobe e some.'));
  pronto();
} else if (folha === 'juntar') {
  $('titulo').textContent = 'Juntar: a carta de cima de uma coluna vai até um topo igual (teste A/B da 0.6.0)';
  $('sub').textContent = 'No Player Fit Test da 0.5.2, o jogador ficava com dois 16 lado a lado sem jeito de juntar e saía. No braço juntar, a carta do topo de uma coluna é arrastada até outra coluna com o mesmo valor no topo: funde e cascateia como uma carta da mão, sem gastar a carta da mão. Nenhum texto: na abertura do nível 1 a mão guiada mostra o gesto (o 16 sai em 2 jogadas), e o topo diferente recebe o proibido. Metade dos jogadores fica com a regra de hoje.';
  $('sub').style.maxWidth = '2050px';
  const g = $('grade'); g.style.gridTemplateColumns = 'repeat(5, 390px)';
  g.appendChild(fig(`${P}juntar-1.png`, '1. A mão mostra', 'Depois do 2 no 2, há um 4 na coluna 3 e outro na coluna 1. Parado 1 s, a mão leva um até o outro, em loop.', 390));
  g.appendChild(fig(`${P}juntar-2.png`, '2. O jogador arrasta', 'A carta sai da coluna e segue o dedo; a coluna com o 4 acende.', 390));
  g.appendChild(fig(`${P}juntar-3.png`, '3. Topo diferente: proibido', 'O 2 sobre o 4 não junta: a coluna fica vermelha com o proibido, e a carta volta ao lugar.', 390));
  g.appendChild(fig(`${P}juntar-4.png`, '4. Funde e cascateia', '4 com 4 dá 8, que encadeia no 8 de baixo: 16.', 390));
  g.appendChild(fig(`${P}juntar-5.png`, '5. O 16 em 2 jogadas', 'A festa da subida, sem pausa. A carta da mão (o 2) continua lá.', 390));
  const pais = document.createElement('div');
  pais.style.gridColumn = '1 / span 4';
  pais.appendChild(fig(`${P}juntar-paisagem.png`, 'Paisagem (computador)', 'O mesmo gesto com o mouse: aperta a carta de cima, arrasta e solta.', 1190));
  g.appendChild(pais);
  pronto();
} else if (folha === 'missao') {
  await document.fonts.load('700 20px Fredoka');
  $('titulo').textContent = 'Missão na mesa: a missão ativa no painel e o prêmio voando até o botão';
  $('sub').textContent = 'Hoje as 3 missões ficam escondidas no menu de pausa (mesmo assim 38% cumprem a de cascata sem saber). Na mesa aparece a mais perto de cumprir, com o desenho do tipo e o contador, sem frase; o selo no canto é o prêmio. Cumprida, o chip fica dourado, o prêmio voa até o botão do item e o botão pulsa (no lugar do aviso "Mission done!"). No guia da fase 1 o chip não aparece. Duas posições para escolher: A, na linha do painel; B, maior, no vão entre o menu e o desfazer (em paisagem, as duas ficam no painel).';
  $('sub').style.maxWidth = '2050px';
  const g = $('grade'); g.style.gridTemplateColumns = 'repeat(5, 390px)';
  g.appendChild(fig(`${P}missao-a.png`, 'A · No painel', 'Entre o mundo e os pontos: cascata de 3 degraus, 1 de 3 feito, prêmio coringa.', 390));
  g.appendChild(fig(`${P}missao-b.png`, 'B · No vão dos botões', 'O mesmo chip, maior, entre o menu e o desfazer.', 390));
  g.appendChild(fig(`${P}missao-voo-1.png`, 'Cumpriu: o chip fica dourado', 'Combo de 5 (5/5); o martelo sai do chip.', 390));
  g.appendChild(fig(`${P}missao-voo-2.png`, 'O prêmio voa', 'Em arco, até o botão do item (0,65 s).', 390));
  g.appendChild(fig(`${P}missao-voo-3.png`, 'Chega ao botão', 'No pouso o botão pulsa com o som do prêmio, a conta sobe e a missão seguinte entra no chip.', 390));
  const pais = document.createElement('div');
  pais.style.gridColumn = '1 / span 3';
  pais.appendChild(fig(`${P}missao-paisagem.png`, 'Paisagem (computador)', 'O chip entra no painel, entre a barra e os pontos.', 1190));
  g.appendChild(pais);
  // os 7 chips sobre o painel de cada mundo
  const chips = document.createElement('div');
  chips.style.gridColumn = '4 / span 2';
  chips.innerHTML = '<b style="display:block;font-size:20px;margin-bottom:10px">Os 7 tipos, no painel de cada mundo</b>';
  const css = document.createElement('style');
  css.textContent = `.faixaM{display:flex;flex-wrap:wrap;gap:12px 16px;padding:14px 16px;border-radius:14px;margin-bottom:10px;border:2.5px solid #e8b84a}
    .chipM{position:relative;display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 10px 0 6px;border-radius:14px;background:rgba(0,0,0,.28);border:2px solid rgba(232,184,74,.75);color:#fff3d6;font-size:15px}
    .chipM svg{width:19px;height:19px;stroke:currentColor;stroke-width:2.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .chipM .mc{min-width:20px;padding:2px 3px;border-radius:4px;font-size:10px;text-align:center;color:#2a1630;background:#fff8ec;box-shadow:0 0 0 1.5px #2a1630}
    .chipM i{position:absolute;right:-8px;top:-9px;width:18px;height:18px;border-radius:9px;background:#ff4fd8;color:#fff;font-style:normal;font-size:11px;line-height:18px;text-align:center}`;
  document.head.appendChild(css);
  const EX = [['fusoes', 12, 30, 'coringa'], ['cascata', 1, 3, 'martelo'], ['cartas', 1, 2, 'troca'], ['montes', 0, 1, 'coringa'], ['combo', 2, 5, 'martelo'], ['descartes', 1, 4, 'troca'], ['pontos', 800, 1500, 'coringa']];
  for (const m of MUNDOS) {
    const pal = TEMAS[m.n].paleta;
    const f = document.createElement('div');
    f.className = 'faixaM';
    f.style.background = `linear-gradient(${pal.painelA}, ${pal.painelB})`;
    f.innerHTML = EX.map(([tipo, at, al, pr]) => `<span class="chipM">${tipo === 'cartas' ? '<span class="mc">128</span>' : ICONES_MISSAO[tipo]}<b>${curto(at)}/${curto(al)}</b><i>${ICONES[pr]}</i></span>`).join('');
    chips.appendChild(f);
  }
  const leg = document.createElement('span');
  leg.style.cssText = 'display:block;color:#cfc6da;font-size:14.5px;line-height:1.4';
  leg.textContent = 'Fusões, cascata (degraus), fazer cartas de um valor, levar um 2048 para fora da mesa, combo, descartes e pontos no mundo.';
  chips.appendChild(leg);
  g.appendChild(chips);
  pronto();
} else if (folha === 'explosoes') {
  await document.fonts.load('700 20px Fredoka');
  definirRotulos({ bomba: 'BOMBA' });
  $('titulo').textContent = 'A explosão de cada mundo';
  $('sub').textContent = 'Quadros congelados (mesma semente: o mesmo quadro sempre) da fusão (0,22 s), da saída do 2048 (0,3 s) e da festa da subida de nível (0,45 s), sobre a mesa do mundo. As cores dos valores não mudam; muda o que voa: folhas, bolhas, flocos, areia, neon.';
  $('sub').style.maxWidth = '1210px';
  const g = $('grade'); g.style.gridTemplateColumns = '250px repeat(3, 300px)'; g.style.alignItems = 'center';
  const C = 300, cw = 78, ch = 110, dpr = 2;
  const EXPL = {
    1: 'Folhas e pétalas saem, giram e caem devagar balançando; pólen no ar.',
    2: 'Bolhas sobem balançando e estouram num anel; no 2048 e na festa, um jato de gotas.',
    3: 'Flocos de seis braços caem devagar girando; cacos de gelo saltam e brilham.',
    4: 'Grãos de areia baixos e rápidos que assentam, com a poeira subindo; no 2048, um gêiser.',
    5: 'Faíscas de quatro pontas e riscos neon com rastro (mistura lighter); no 2048, a supernova de anéis.',
  };
  const QUADROS = [
    { tipo: 'fusao', valor: 32, degrau: 2, t: 0.22, rotulo: 'Fusão (×2) · 0,22 s' },
    { tipo: 'completar', valor: 2048, t: 0.3, rotulo: '2048 sai da mesa · 0,3 s' },
    { tipo: 'festa', valor: 128, t: 0.45, rotulo: 'Festa da subida · 0,45 s' },
  ];
  for (const m of MUNDOS) {
    const tema = TEMAS[m.n];
    definirTema(tema); limparCache();
    const cap = document.createElement('div');
    cap.innerHTML = `<b style="display:block;font-size:22px">Mundo ${m.n} · ${m.nome}</b><span style="display:block;color:#cfc6da;font-size:14.5px;line-height:1.35;margin-top:6px">${EXPL[m.n]}</span>`;
    g.appendChild(cap);
    for (const q of QUADROS) {
      const f = document.createElement('figure');
      const cv = document.createElement('canvas');
      cv.width = C * dpr; cv.height = C * dpr; cv.style.width = C + 'px'; cv.style.height = C + 'px';
      const ctx = cv.getContext('2d'); ctx.scale(dpr, dpr);
      tema.mesa.tabuleiro(ctx, { x: 4, y: 4, w: C - 8, h: C - 8 }, tema.paleta, 0, 0);
      const cx = C / 2, cy = C * 0.56;
      if (q.tipo !== 'completar') desenharCarta(ctx, { id: 1, tipo: 'normal', v: q.valor }, { x: cx - cw / 2, y: cy - ch / 2, w: cw, h: ch, dpr, t: 0.6 });
      else desenharCarta(ctx, { id: 1, tipo: 'normal', v: 2048 }, { x: cx - cw / 2, y: cy - ch / 2 - ch * 0.5, w: cw, h: ch, dpr, t: 0.6, esc: 1.15, alpha: 0.6 });
      const part = criarParticulas();
      registrarFormas(part, tema);
      tocarEfeito({ tipo: q.tipo, x: cx, y: cy, valor: q.valor, degrau: q.degrau }, { part, tema, esc: cw / 62, ch, textos: { combo: 'COMBO ×{n}' } });
      for (let i = 0; i < Math.round(q.t * 60); i++) part.atualizar(1 / 60);
      part.desenhar(ctx);
      if (q.tipo === 'festa') Tr.festa(ctx, q.t, { W: C, H: C, texto: '128!', y: C * 0.26, cores: tema.paleta.festa, semente: 7 });
      f.appendChild(cv);
      const c = document.createElement('figcaption'); c.innerHTML = `<span>${q.rotulo}</span>`; f.appendChild(c);
      g.appendChild(f);
    }
  }
  document.fonts.ready.then(() => { document.title = 'PRONTO'; });
}
</script>
</body></html>
