<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>sdkcheck</title>
<style>html,body{margin:0;background:#111;color:#eee;font:13px monospace}iframe{border:0;width:390px;height:844px;display:block}</style></head>
<body><iframe id="f"></iframe><pre id="resultado"></pre>
<script type="module">
// Banco de testes do SDK: carrega o jogo num iframe (srcdoc, mesma origem)
// trocando a tag do SDK da Poki por um SDK falso que registra cada chamada,
// e simula o jogador. ?cenario=normal|recusa|bloqueado|pendente|lsquebrado
const q = new URLSearchParams(location.search);
const cenario = q.get('cenario') || 'normal';
// raiz do jogo testado: '' (fonte) ou 'dist/' (build que vai para a Poki)
const raiz = (q.get('raiz') || '').replace(/[^a-z0-9/_-]/gi, '');
const log = [];
const t0 = performance.now();
const anotar = (...x) => log.push([Math.round(performance.now() - t0), ...x]);
window.__log = log;
const falhas = [];
const conferir = (ok, msg) => { if (!ok) falhas.push(msg); };
const espera = (ms) => new Promise((r) => setTimeout(r, ms));

// O intervalo comercial falso dura 2,5 s, mais que a sobra da transicao
// (0,4 s depois da troca): com 400 ms um video de verdade travava o jogo na
// passagem de fase e o banco passava assim mesmo.
const sdkFalso = `
<script>
  const L = (...x) => parent.__anotar(...x);
  window.PokiSDK = {
    init() { L('init'); return ${cenario === 'pendente' ? 'new Promise(() => {})' : 'Promise.resolve()'}; },
    gameLoadingFinished() { L('gameLoadingFinished'); },
    gameplayStart() { L('gameplayStart'); },
    gameplayStop() { L('gameplayStop'); },
    commercialBreak(aoIniciar) { L('commercialBreak', parent.__calado()); if (aoIniciar) aoIniciar(); return new Promise((r) => setTimeout(() => { L('fimCommercial', parent.__calado()); r(); }, 2500)); },
    rewardedBreak(o) { L('rewardedBreak', parent.__calado()); const ini = typeof o === 'function' ? o : o && o.onStart; if (ini) ini(); return new Promise((r) => setTimeout(() => r(${cenario === 'recusa' ? 'false' : 'true'}), 300)); },
    measure(a, b, c) { L('measure', a + '/' + b + '/' + c); },
    movePill() { L('movePill'); },
    getDeviceInfo() { return { category: 'mobile' }; },
  };
<\/script>`;
const lsQuebrado = `
<script>
  const quebra = () => { throw new Error('quota'); };
  Storage.prototype.getItem = quebra; Storage.prototype.setItem = quebra; Storage.prototype.removeItem = quebra;
<\/script>`;
window.__anotar = anotar;
window.__calado = () => { try { return !!f.contentWindow.__c2.audio.calado; } catch { return 'n/a'; } };

const f = document.getElementById('f');
let html = await (await fetch('../' + raiz + 'index.html')).text();
const tag = /<!-- Unico script externo permitido pela Poki. -->\s*<script src="https:\/\/game-cdn\.poki\.com\/scripts\/v2\/poki-sdk\.js"><\/script>/;
conferir(tag.test(html), 'index.html sem a tag do SDK da Poki no formato esperado');
const nivel = 3;
const teste = `<script>window.__cards2048Teste = { nivel: ${nivel}, fixo: true };<\/script>`;
const extra = cenario === 'bloqueado' ? '' : cenario === 'lsquebrado' ? lsQuebrado + sdkFalso : sdkFalso;
html = html.replace(tag, extra).replace('<head>', '<head><base href="/' + raiz + '">' + teste);
f.srcdoc = html;
await new Promise((r) => (f.onload = r));
const w = () => f.contentWindow;
const ct = () => w().__c2;
const nomes = () => log.map((l) => l[1]);
const toque = (id) => {
  const cv = w().document.getElementById('cena');
  cv.dispatchEvent(new (w().PointerEvent)('pointerdown', { clientX: 30, clientY: 600, pointerId: id, bubbles: true }));
  cv.dispatchEvent(new (w().PointerEvent)('pointerup', { clientX: 30, clientY: 600, pointerId: id, bubbles: true }));
};

await espera(600);
conferir(!!ct(), 'jogo nao subiu (sem __c2)');
conferir(ct() && ct().J.e && ct().J.e.colunas.length > 0, 'fase nao montou');
if (cenario === 'bloqueado' || cenario === 'pendente') {
  await espera(4600);
  conferir(w().document.body.classList.contains('sem-anuncio'), 'sem SDK os botoes de video deviam sumir');
  // o jogo segue jogavel: resolve a fase sozinho
  ct().auto(120);
  await espera(12000);
  conferir(ct().J.n > nivel, 'sem SDK a fase nao avancou');
} else {
  conferir(nomes().includes('init'), 'init nao chamado');
  conferir(nomes().includes('gameLoadingFinished'), 'gameLoadingFinished nao chamado');
  conferir(!nomes().includes('gameplayStart'), 'gameplayStart antes de qualquer toque');
  await espera(1200);
  conferir(!nomes().includes('gameplayStart'), 'gameplayStart sem input');
  // toque real na mesa
  toque(1);
  conferir(nomes().includes('gameplayStart'), 'gameplayStart nao veio depois do toque');
  // mesa cheia: primeiro o continuar gratis, depois o video
  ct().fimTeste();
  await espera(300);
  conferir(nomes().lastIndexOf('gameplayStop') > nomes().lastIndexOf('gameplayStart'), 'mesa cheia sem gameplayStop');
  w().document.getElementById('bFimContinuar').click();
  await espera(300);
  conferir(ct().J.estado === 'jogando', 'continuar gratis nao voltou ao jogo');
  conferir(!nomes().includes('rewardedBreak'), 'continuar gratis chamou rewardedBreak');
  ct().fimTeste();
  await espera(300);
  conferir(!w().document.getElementById('bFimVideo').hidden, 'botao de video do continuar nao apareceu');
  w().document.getElementById('bFimVideo').click();
  await espera(700);
  const rw = log.find((l) => l[1] === 'rewardedBreak');
  conferir(!!rw, 'rewardedBreak nao chamado');
  conferir(rw && rw[2] === true, 'som nao estava mudo durante o rewarded');
  if (cenario === 'recusa') {
    conferir(ct().J.estado === 'fim' && ct().J.e.continuacoes === 1, 'premio dado com rewarded false');
    w().document.getElementById('bFimDeNovo').click();
    await espera(300);
  } else conferir(ct().J.estado === 'jogando' && ct().J.e.continuacoes === 2, 'premio negado com rewarded true');
  conferir(!nomes().slice(nomes().lastIndexOf('rewardedBreak')).includes('gameplayStart') || cenario !== 'recusa', 'gameplayStart depois do rewarded sem toque');
  // termina as fases 3 e 4 (sem intervalo) e entra na 5 (com intervalo)
  toque(3);
  ct().auto(120);
  await espera(3000);
  await espera(19000);
  conferir(ct().J.n >= 5, 'nao chegou a fase 5 (fase ' + ct().J.n + ')');
  // para o automatico e deixa terminar o intervalo e a transicao que estiverem no meio
  ct().auto(0);
  for (let i = 0; i < 40 && ct().J.estado !== 'jogando'; i++) await espera(250);
  await espera(500);
  const cb = log.filter((l) => l[1] === 'commercialBreak');
  const iMedida = (m) => log.findIndex((l) => l[1] === 'measure' && l[2] === m);
  conferir(cb.length >= 1, 'nenhum commercialBreak na entrada da fase 5');
  // nada de intervalo antes: o primeiro vem entre o fim da 4 e o comeco da 5
  conferir(cb.length && log.indexOf(cb[0]) > iMedida('level/4/complete') && log.indexOf(cb[0]) < iMedida('level/5/start'), 'primeiro commercialBreak fora da entrada da fase 5');
  conferir(cb[0] && cb[0][2] === true, 'som nao estava mudo durante o commercialBreak');
  const iCb = log.indexOf(cb[0]);
  const stopAntes = log.slice(0, iCb).map((l) => l[1]).lastIndexOf('gameplayStop') > log.slice(0, iCb).map((l) => l[1]).lastIndexOf('gameplayStart');
  conferir(stopAntes, 'commercialBreak sem gameplayStop antes');
  const depoisCb = log.slice(iCb + 1).map((l) => l[1]);
  conferir(!depoisCb.includes('gameplayStart'), 'gameplayStart depois do anuncio sem novo toque');
  const fimCb = log.find((l) => l[1] === 'fimCommercial');
  conferir(fimCb && fimCb[2] === true, 'som voltou antes do fim do anuncio');
  conferir(fimCb && log.indexOf(fimCb) < iMedida('level/5/start'), 'a fase 5 nao comecou depois que o anuncio voltou');
  conferir(!window.__calado(), 'som nao voltou depois do anuncio');
  const medidas = log.filter((l) => l[1] === 'measure').map((l) => l[2]);
  conferir(medidas.includes('level/3/start') && medidas.includes('level/3/complete'), 'measure de fase faltando: ' + medidas.join(','));
  conferir(medidas.includes('game/toque/first'), 'measure do primeiro toque faltando');
  conferir(nomes().includes('movePill'), 'movePill nao chamado');
  // depois do intervalo o jogo volta a responder ao toque
  conferir(ct().J.estado === 'jogando', 'depois do anuncio o jogo nao voltou a jogar (estado ' + ct().J.estado + ')');
  const iFim = log.map((l) => l[1]).lastIndexOf('fimCommercial');
  toque(4);
  conferir(log.slice(iFim + 1).some((l) => l[1] === 'gameplayStart'), 'toque depois do anuncio nao deu gameplayStart');
  // nunca dois eventos iguais seguidos
  const gp = nomes().filter((n) => n === 'gameplayStart' || n === 'gameplayStop');
  conferir(gp.every((n, i) => i === 0 || n !== gp[i - 1]), 'gameplayStart/Stop repetido: ' + gp.join(','));
}
if (cenario === 'lsquebrado') conferir(ct().J.n > nivel, 'com localStorage quebrado o jogo nao avancou');
const r = { cenario, passou: falhas.length === 0, falhas, log };
document.title = r.passou ? 'PASSOU' : 'FALHOU';
document.getElementById('resultado').textContent = 'RESULTADO ' + JSON.stringify(r);
</script></body></html>
