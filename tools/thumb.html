<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>thumb</title>
<style>html,body{margin:0;overflow:hidden;background:#000}canvas{display:block}</style></head>
<body><canvas id="c"></canvas><pre id="medidas"></pre>
<script type="module">
// Thumb da Poki desenhada com a arte do proprio jogo: a arena de um reino, o
// monstro gigante levando o golpe especial (o raio da carta 2048 que nasce da
// cascata) e o numero do dano. Regras (developers.poki.com/guide/game-thumbnail):
//   - quadrado 1:1 de no minimo 628 px, sangrado: sem borda, margem, tarja nem
//     faixa lisa encostada na beirada; a Poki arredonda os cantos;
//   - sem texto (os numeros das cartas e do dano sao o proprio jogo);
//   - um assunto principal (o monstro levando o golpe), fundo limpo;
//   - contraste alto e nenhuma cor perto do #83FFE7 do site;
//   - legivel nos tiles pequenos (ver ?grade).
//   ?opcao=a..h&s=1256      a thumb no tamanho s (a janela deve ter s x s)
//   ?opcao=a&grade          folha de conferencia: tiles de 314 a 94 px sobre o #83FFE7
//   ?opcao=a&medir          mede a thumb de 628 px e escreve o JSON em #medidas
import { arenaDe } from '../src/render/arena.js';
import { desenharCarta } from '../src/render/cartas.js';
import { corDuelo } from '../src/render/cartaDuelo.js';
import { desenharMonstro, variante } from '../src/render/monstros.js';
import { texto, estrela, rr, circulo, elipse, TINTA } from '../src/render/desenho.js';

const q = new URLSearchParams(location.search);
const opcao = q.get('opcao') || 'a';
const S = Math.max(64, parseInt(q.get('s') || '1256', 10));
const POKI = '#83FFE7';
const TILES = [314, 204, 140, 94];

/**
 * Opcoes: reino, monstro (especie e posicao; 8 = chefao), pose e cena.
 * a-d: cena 'raio' (coluna da cascata a esquerda, raio do 2048 ate o monstro, dano);
 * e-g: cena 'perto' (o monstro de perto levando a carta 2048 na cara; sem texto alem da carta).
 */
const OPCOES = {
  a: { cena: 'raio', reino: 1, especie: 'gosmo', pos: 1, furia: false },
  b: { cena: 'raio', reino: 5, especie: 'dragao', pos: 8, furia: true },
  c: { cena: 'raio', reino: 3, especie: 'yeti', pos: 8, furia: false },
  d: { cena: 'raio', reino: 4, especie: 'espectro', pos: 4, furia: false },
  e: { cena: 'perto', reino: 1, especie: 'gosmo', pos: 1, furia: false, perto: {
    M: { x: 412, y: 598, R: 192 }, recua: 0.05, golpe: true, estouro: [228, 306, 72],
    carta: { x: 16, y: 92, w: 184, rot: -0.3 },
  } },
  f: { cena: 'perto', reino: 5, especie: 'dragao', pos: 8, furia: true, perto: {
    M: { x: 410, y: 600, R: 180 }, recua: 0.05, golpe: true, estouro: [246, 276, 72],
    carta: { x: 16, y: 90, w: 184, rot: -0.3 },
  } },
  h: { cena: 'perto', reino: 1, especie: 'gosmo', pos: 1, furia: false, perto: {
    M: { x: 424, y: 600, R: 188 }, recua: 0.04,
    carta: { x: 16, y: 168, w: 184, rot: -0.2 }, voo: -0.3, linhas: [[-70, -50, 130, 11], [-10, -70, 190, 15], [50, -50, 120, 11]],
  } },
};
const O = OPCOES[opcao] || OPCOES.a;
const arena = arenaDe(O.reino);
const def = variante(O.especie, O.pos);

let ctx = null;
let k = 1; // tudo num quadrado virtual de 600
/** Monstro grande a direita; os pes na arena (cena 'raio'). */
const M = { x: 398, y: 372, R: 122 };
/** Cena 'perto': a arena atras fica na escala normal (o monstro de perto vem de OPCOES). */
const FUNDO = { x: 384, y: 470, R: 118 };

function carta(v, x, y, w, rot, alpha = 1) {
  ctx.save();
  ctx.scale(k, k);
  desenharCarta(ctx, { id: v, tipo: 'normal', v, cor: 0 }, { x, y, w, h: w / 0.72, alpha, rot, dpr: k, t: 0.4 });
  ctx.restore();
}

/** Raio do golpe especial: da carta 2048 ate o monstro. */
function raio(x0, y0, x1, y1) {
  let s = 11;
  const r = () => { s = (s * 1103515245 + 12345) >>> 0; return s / 4294967296; };
  const n = 8;
  const pts = [[x0, y0]];
  for (let i = 1; i < n; i++) {
    const u = i / n, j = (r() - 0.5) * 60 * (1 - Math.abs(u - 0.5));
    pts.push([x0 + (x1 - x0) * u + j * 0.4, y0 + (y1 - y0) * u + j]);
  }
  pts.push([x1, y1]);
  ctx.save(); ctx.scale(k, k);
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.shadowColor = '#fff3a0'; ctx.shadowBlur = 30;
  for (const [larg, cor] of [[28, 'rgba(255,226,122,0.5)'], [14, '#ffe27a'], [5, '#ffffff']]) {
    ctx.beginPath(); pts.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)));
    ctx.strokeStyle = cor; ctx.lineWidth = larg; ctx.stroke();
  }
  ctx.restore();
}

function faiscas(cx, cy, raioMin, raioMax, n, semente) {
  ctx.save(); ctx.scale(k, k);
  let s = semente;
  const r = () => { s = (s * 1103515245 + 12345) >>> 0; return s / 4294967296; };
  for (let i = 0; i < n; i++) {
    const a = r() * Math.PI * 2, d = raioMin + r() * (raioMax - raioMin), t = 6 + r() * 10;
    estrela(ctx, cx + Math.cos(a) * d, cy + Math.sin(a) * d, t, t * 0.42, 4, a);
    ctx.fillStyle = ['#ffe27a', '#ffffff', '#ff8a3d'][i % 3]; ctx.globalAlpha = 0.6 + r() * 0.4; ctx.fill();
  }
  ctx.restore();
}

function desenhar(s) {
  k = s / 600;
  if (O.cena === 'perto') { cenaPerto(); return; }
  ctx.save(); ctx.scale(k, k);
  arena.parado(ctx, 600, 600, { monstro: M, retrato: true });
  arena.vivo(ctx, 600, 600, 2.2, { monstro: M, retrato: true });
  // vinheta: o olho vai ao golpe, os cantos escurecem (contraste com a carta)
  const v = ctx.createRadialGradient(330, 300, 170, 330, 300, 520);
  v.addColorStop(0, 'rgba(10,4,20,0)'); v.addColorStop(0.7, 'rgba(10,4,20,0.35)'); v.addColorStop(1, 'rgba(10,4,20,0.8)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, 600, 600);
  // o monstro levando o golpe: olhos apertados de dor (a furia na opcao do chefao)
  desenharMonstro(ctx, def, M, 1.1, { golpe: 0.93, furia: O.furia });
  ctx.restore();
  // a coluna da cascata, como na mesa: a faixa de cada carta aparece, a menor embaixo
  [[1024, 352], [512, 396], [256, 440], [128, 484]].forEach(([val, y]) => carta(val, 26, y, 132, 0));
  // o 2048 salta da coluna, com brilho
  ctx.save(); ctx.scale(k, k);
  ctx.translate(108, 238); ctx.rotate(-0.1);
  ctx.shadowColor = '#ffd84a'; ctx.shadowBlur = 55;
  rr(ctx, -82, -112, 164, 224, 20); ctx.fillStyle = 'rgba(255,216,74,0.35)'; ctx.fill();
  ctx.restore();
  carta(2048, 30, 128, 156, -0.1);
  raio(188, 196, M.x - 30, M.y - M.R * 0.95);
  faiscas(M.x - 20, M.y - M.R * 0.95, 30, 140, 24, 7);
  faiscas(110, 240, 100, 150, 10, 3);
  // o numero do dano saindo do monstro
  ctx.save(); ctx.scale(k, k);
  ctx.translate(M.x + 40, M.y - M.R * 2.22); ctx.rotate(0.06);
  texto(ctx, '-2048', 0, 0, 72, '#ffffff', { contorno: '#a3122b', espessura: 16 });
  ctx.restore();
}

/** Estouro do golpe (sem texto): estrela de quadrinho com miolo branco e brilho. */
function estouro(x, y, r) {
  ctx.save(); ctx.scale(k, k);
  const g = ctx.createRadialGradient(x, y, r * 0.2, x, y, r * 1.7);
  g.addColorStop(0, 'rgba(255,240,170,0.9)'); g.addColorStop(0.5, 'rgba(255,190,60,0.35)'); g.addColorStop(1, 'rgba(255,160,40,0)');
  ctx.fillStyle = g; circulo(ctx, x, y, r * 1.7); ctx.fill();
  estrela(ctx, x, y, r, r * 0.62, 11, 0.2); ctx.fillStyle = '#ff9a2e'; ctx.fill();
  ctx.lineWidth = 6; ctx.lineJoin = 'round'; ctx.strokeStyle = TINTA; ctx.stroke();
  estrela(ctx, x, y, r * 0.78, r * 0.5, 11, 0.35); ctx.fillStyle = '#ffe27a'; ctx.fill();
  estrela(ctx, x, y, r * 0.46, r * 0.3, 9, 0.1); ctx.fillStyle = '#ffffff'; ctx.fill();
  ctx.restore();
}

/** Linhas de velocidade atras da carta (ang: direcao do voo). */
function velocidade(x, y, ang, linhas) {
  ctx.save(); ctx.scale(k, k);
  ctx.translate(x, y); ctx.rotate(ang);
  ctx.lineCap = 'round';
  for (const [dy, x0, comp, larg] of linhas) {
    const g = ctx.createLinearGradient(x0, 0, x0 - comp, 0);
    g.addColorStop(0, 'rgba(255,255,255,0.95)'); g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.beginPath(); ctx.moveTo(x0, dy); ctx.lineTo(x0 - comp, dy);
    ctx.strokeStyle = g; ctx.lineWidth = larg; ctx.stroke();
  }
  ctx.restore();
}

/** Lagrimas saltando dos olhos, no espaco do monstro (origem nos pes, raio R). */
function lagrimas(R) {
  for (const s of [-1, 1]) {
    const r = R * 0.085;
    ctx.save(); ctx.translate(s * R * 0.7, -R * 1.02); ctx.rotate(s * 1.0);
    ctx.beginPath(); ctx.moveTo(0, -r * 1.7); ctx.quadraticCurveTo(r * 1.05, -r * 0.2, 0, r); ctx.quadraticCurveTo(-r * 1.05, -r * 0.2, 0, -r * 1.7); ctx.closePath();
    ctx.fillStyle = '#7fd0ff'; ctx.fill(); ctx.lineWidth = R * 0.03; ctx.strokeStyle = TINTA; ctx.stroke();
    elipse(ctx, -r * 0.3, -r * 0.2, r * 0.22, r * 0.34); ctx.fillStyle = 'rgba(255,255,255,0.85)'; ctx.fill();
    ctx.restore();
  }
}

/** Carta 2048 com brilho dourado atras. */
function carta2048(x, y, w, rot) {
  const h = w / 0.72;
  ctx.save(); ctx.scale(k, k);
  ctx.translate(x + w / 2, y + h / 2); ctx.rotate(rot);
  ctx.shadowColor = '#ffd84a'; ctx.shadowBlur = 60;
  rr(ctx, -w / 2 - 6, -h / 2 - 6, w + 12, h + 12, 26); ctx.fillStyle = 'rgba(255,216,74,0.45)'; ctx.fill();
  ctx.restore();
  carta(2048, x, y, w, rot);
}

/**
 * Cena 'perto': a arena atras e o monstro gigante. Com golpe, a carta 2048
 * acerta a cabeca dele (careta de dor, lagrimas, estouro); sem golpe, ela
 * vem voando e ele arregala os olhos.
 */
function cenaPerto() {
  const P = O.perto, M = P.M;
  ctx.save(); ctx.scale(k, k);
  arena.parado(ctx, 600, 600, { monstro: FUNDO, retrato: true });
  arena.vivo(ctx, 600, 600, 2.2, { monstro: FUNDO, retrato: true });
  const v = ctx.createRadialGradient(360, 330, 200, 360, 330, 560);
  v.addColorStop(0, 'rgba(10,4,20,0)'); v.addColorStop(0.65, 'rgba(10,4,20,0.3)'); v.addColorStop(1, 'rgba(10,4,20,0.75)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, 600, 600);
  // o monstro recua: inclina para longe da carta, apoiado na base
  ctx.save();
  ctx.translate(M.x, M.y); ctx.rotate(P.recua); ctx.translate(-M.x, -M.y);
  desenharMonstro(ctx, def, M, 1.1, { golpe: P.golpe ? 0.93 : 1, furia: O.furia, espanto: 1 });
  if (P.golpe) { ctx.translate(M.x, M.y); lagrimas(M.R * (def.escala || 1)); }
  ctx.restore();
  ctx.restore();
  if (P.estouro) { const [bx, by, br] = P.estouro; estouro(bx, by, br); }
  const { x, y, w, rot } = P.carta;
  if (P.linhas) velocidade(x + w / 2, y + w / 0.72 / 2, P.voo, P.linhas);
  carta2048(x, y, w, rot);
  if (P.estouro) { const [bx, by, br] = P.estouro; faiscas(bx, by, br * 0.7, br * 1.9, 22, 7); }
  else faiscas(x + w * 0.6, y + w * 0.7, w * 0.75, w * 1.1, 16, 3);
}

function thumb(cv, s) {
  cv.width = s; cv.height = s;
  ctx = cv.getContext('2d');
  desenhar(s);
}

// ------------------------------------------------------------ medidas
function lab(r, g, b) {
  const lin = (v) => { v /= 255; return v <= 0.04045 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4; };
  const R = lin(r), G = lin(g), B = lin(b);
  const f = (t) => (t > 216 / 24389 ? Math.cbrt(t) : (24389 / 27 * t + 16) / 116);
  const x = f((R * 0.4124 + G * 0.3576 + B * 0.1805) / 0.95047);
  const y = f(R * 0.2126 + G * 0.7152 + B * 0.0722);
  const z = f((R * 0.0193 + G * 0.1192 + B * 0.9505) / 1.08883);
  return [116 * y - 16, 500 * (x - y), 200 * (y - z)];
}
function lum(r, g, b) {
  const lin = (v) => { v /= 255; return v <= 0.04045 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4; };
  return 0.2126 * lin(r) + 0.7152 * lin(g) + 0.0722 * lin(b);
}
/** Contraste WCAG entre a carta 2048 (a cor da faixa dela) e a media do fundo nos cantos. */
function contrasteCarta(d, s) {
  const amostra = (x0, y0) => { let r = 0, g = 0, b = 0, n = 0; for (let y = y0; y < y0 + 20; y++) for (let x = x0; x < x0 + 20; x++) { const i = (y * s + x) * 4; r += d[i]; g += d[i + 1]; b += d[i + 2]; n++; } return [r / n, g / n, b / n]; };
  const cantos = [amostra(10, 10), amostra(s - 30, 10), amostra(10, s - 30), amostra(s - 30, s - 30)];
  const fundo = cantos.reduce((a, c) => a + lum(...c), 0) / 4;
  const n = parseInt(corDuelo(2048).slice(1), 16);
  const carta2048 = lum((n >> 16) & 255, (n >> 8) & 255, n & 255);
  return +((Math.max(fundo, carta2048) + 0.05) / (Math.min(fundo, carta2048) + 0.05)).toFixed(2);
}
function medir(cv) {
  const s = cv.width;
  const d = cv.getContext('2d').getImageData(0, 0, s, s).data;
  const n = parseInt(POKI.slice(1), 16);
  const P = lab((n >> 16) & 255, (n >> 8) & 255, n & 255);
  const dist = (L, M) => Math.hypot(L[0] - M[0], L[1] - M[1], L[2] - M[2]);
  const cor = (x, y) => { const i = (y * s + x) * 4; return lab(d[i], d[i + 1], d[i + 2]); };
  let perto = 0, opaca = true, somaB = 0, nB = 0;
  const anel = Math.round(s * 0.02);
  for (let y = 0; y < s; y++) for (let x = 0; x < s; x++) {
    if (d[(y * s + x) * 4 + 3] < 255) opaca = false;
    const e = dist(cor(x, y), P);
    if (e < 25) perto++;
    if (x < anel || y < anel || x >= s - anel || y >= s - anel) { somaB += e; nB++; }
  }
  const f = Math.round(s * 0.04);
  const faixa = (x0, y0, w, h) => {
    const labs = [];
    for (let y = y0; y < y0 + h; y += 2) for (let x = x0; x < x0 + w; x += 2) labs.push(cor(x, y));
    const m = [0, 1, 2].map((c) => labs.reduce((a, L) => a + L[c], 0) / labs.length);
    return { m, lisa: labs.filter((L) => dist(L, m) < 3).length / labs.length };
  };
  const lados = { topo: [[0, 0, s, f], [0, f, s, f]], base: [[0, s - f, s, f], [0, s - 2 * f, s, f]], esq: [[0, 0, f, s], [f, 0, f, s]], dir: [[s - f, 0, f, s], [s - 2 * f, 0, f, s]] };
  const tarja = [];
  for (const [lado, [b, i]] of Object.entries(lados)) { const B = faixa(...b), I = faixa(...i); if (B.lisa > 0.9 && dist(B.m, I.m) > 8) tarja.push(lado); }
  return { lado: s, pertoPoki: +(perto / (s * s)).toFixed(4), bordaPoki: +(somaB / nB).toFixed(1), tarja, contraste: { carta: contrasteCarta(d, s) }, opaca };
}

const cv = document.getElementById('c');
const pronto = () => {
  if (q.has('grade')) {
    const big = document.createElement('canvas');
    thumb(big, 1256);
    const m = 28;
    cv.width = TILES.reduce((a, t) => a + t + m, m);
    cv.height = TILES[0] + 2 * m;
    const g = cv.getContext('2d');
    g.fillStyle = POKI; g.fillRect(0, 0, cv.width, cv.height);
    g.imageSmoothingQuality = 'high';
    let x = m;
    for (const t of TILES) {
      const y = m + TILES[0] - t;
      g.save(); g.beginPath(); g.roundRect(x, y, t, t, Math.max(8, t * 0.08)); g.clip();
      g.drawImage(big, x, y, t, t); g.restore();
      x += t + m;
    }
  } else if (q.has('medir')) {
    thumb(cv, 628);
    document.getElementById('medidas').textContent = JSON.stringify(medir(cv));
  } else thumb(cv, S);
  document.title = 'PRONTO';
};
if (document.fonts && document.fonts.load) document.fonts.load('700 40px Fredoka').then(pronto, pronto); else pronto();
</script></body></html>
